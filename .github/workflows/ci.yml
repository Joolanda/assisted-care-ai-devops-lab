name: CI

on:
  push:
    branches:
      - main
      - "devops/**"
      - "feat/**"
      - "ml/**"
      - "rag/**"
      - "security/**"
      - "pm/**"
      - "docs/**"
      - "test/**"
      - "fix/**"
      - "refactor/**"
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Test and Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pydantic pytest httpx ruff

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t assisted-care-ai-devops-lab .
