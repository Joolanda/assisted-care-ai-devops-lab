[project]
name = "assisted-care-ai-devops-lab"
version = "0.1.0"
description = "AI DevOps lab for responsible assisted-care workflows using simulated IoT events, anomaly detection, RAG, monitoring and CI/CD."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100